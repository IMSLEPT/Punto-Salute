name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app - dipendenze, validazione contenuti, build
        working-directory: web
        run: |
          npm ci
          node tools/validate.mjs
          node build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK (Gradle)
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rinomina e verifica
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/PuntoSalute-$(cat VERSION).apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PuntoSalute-apk
          path: dist/*.apk

  # Percorso alternativo senza Android SDK/Gradle (stesso risultato, solo artefatti Maven/PyPI)
  apk-sdkless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          (cd web && npm ci && node build.mjs)
          python3 -m pip install --quiet aapt2==0.2.1 apksigtool
          python3 tools/build_apk.py --out dist/PuntoSalute-sdkless.apk
          python3 -m apksigtool verify dist/PuntoSalute-sdkless.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PuntoSalute-apk-sdkless
          path: dist/*.apk
